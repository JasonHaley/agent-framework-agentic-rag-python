# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

name: agent-framework-agentic-rag-python
metadata:
    template: azd-init@1.23.2
services:
    app:
        project: src
        language: python
        host: containerapp
        docker:
            remoteBuild: true
hooks:
    postprovision:
        windows:
            shell: pwsh
            run:  ./scripts/load_index.ps1
            interactive: false
            continueOnError: false
        posix:
            shell: sh
            run:  ./scripts/load_index.sh
            interactive: false
            continueOnError: false
resources:
    app:
        type: host.containerapp
        port: 80
